volumes:
  pg_data_production:
  static_volume:

# Всё отличие — заменяем build на image и указываем, какой образ использовать
services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    image: lastman572/kittygram_backend # Качаем с Docker Hub
    env_file: .env
    command: gunicorn --bind 0.0.0.0:8000 app:app
    volumes:
      - static_volume:/backend_static
  frontend:
    image: lastman572/kittygram_frontend  # Качаем с Docker Hub
    env_file: .env
    command: sh -c "cp -r /app/build/. /static/ && tail -f /dev/null"
    volumes:
      - static_volume:/frontend_static
  gateway:
    image: lastman572/kittygram_gateway  # Качаем с Docker Hub
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80 
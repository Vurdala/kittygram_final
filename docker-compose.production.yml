volumes:
  pg_data_production:
  static_volume:
  media_volume:
# Всё отличие — заменяем build на image и указываем, какой образ использовать
services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    depends_on:
      - db
    image: lastman572/kitty_backend:10 # Качаем с Docker Hub
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/mediafiles
  frontend:
    image: lastman572/kitty_frontend:10 # Качаем с Docker Hub
    env_file: .env
    command: sh -c "cp -r /app/build/. /static/ && tail -f /dev/null"
    volumes:
      - static_volume:/frontend_static
  gateway:
    depends_on:
      - backend
      - frontend
    image: lastman572/kitty_gateway:14  # Качаем с Docker Hub
    env_file: .env
    volumes:
      - static_volume:/staticfiles
      - media_volume:/mediafiles
    ports:
      - 8000:80 
